<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СК РФ — Терминал v5</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #0a0e14; color: #d6e2ef; padding: 8px; max-width: 1000px; margin: 0 auto;
    padding-bottom: 60px; font-size: 14px; line-height: 1.4;
  }
  h1 { font-size: 15px; text-align: center; color: #4da3ff; padding: 8px 0; margin-bottom: 8px; border-bottom: 1px solid #1a2332; letter-spacing: .5px; }
  h3 { font-size: 12px; color: #4da3ff; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 3px; margin-bottom: 8px; flex-wrap: wrap; }
  .tab { flex: 1; min-width: 60px; padding: 8px 4px; background: #141c28; border: 1px solid #22324a; border-radius: 6px; text-align: center; cursor: pointer; font-size: 10px; transition: .15s; user-select: none; }
  .tab.active { background: #1e4976; border-color: #4da3ff; color: #fff; font-weight: bold; }
  .tab:active { transform: scale(.95); }
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: #141c28; border: 1px solid #22324a; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  label { display: block; font-size: 11px; color: #7fa5c9; margin: 6px 0 3px; font-weight: 500; }
  input, select, textarea { width: 100%; padding: 8px; background: #0a0e14; border: 1px solid #22324a; border-radius: 5px; color: #d6e2ef; font-size: 13px; font-family: inherit; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #4da3ff; }
  textarea { resize: vertical; min-height: 50px; }
  button { padding: 7px 11px; background: #1e4976; color: #fff; border: 1px solid #4da3ff; border-radius: 5px; cursor: pointer; font-size: 12px; margin: 4px 0; transition: .15s; font-family: inherit; }
  button:hover { background: #2a5f96; }
  button:active { transform: scale(.96); }
  button.red { background: #6b1e1e; border-color: #ff4d4d; }
  button.red:hover { background: #8a2828; }
  button.green { background: #1e5f30; border-color: #4dff88; }
  button.green:hover { background: #2a7a42; }
  button.gray { background: #2a2a2a; border-color: #555; }
  button.gray:hover { background: #3a3a3a; }
  button.orange { background: #6b4a1e; border-color: #ffaa00; }
  button.orange:hover { background: #8a5f28; }
  button.sm { padding: 3px 7px; font-size: 11px; margin: 0 2px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-end; }
  .row > * { flex: 1; min-width: 90px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  @media (max-width: 560px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
  .item { background: #0a0e14; border-left: 3px solid #4da3ff; padding: 8px 10px; margin-bottom: 5px; border-radius: 4px; font-size: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
  .item.done { border-left-color: #4dff88; opacity: .5; text-decoration: line-through; }
  .item.wanted { border-left-color: #ff4d4d; }
  .item.arrest { border-left-color: #ffaa00; }
  .item.priority-high { border-left-color: #ff4d4d; }
  .item.priority-med { border-left-color: #ffaa00; }
  .item.priority-low { border-left-color: #4dff88; }
  .item .del { color: #ff4d4d; cursor: pointer; font-weight: bold; padding: 2px 6px; font-size: 14px; line-height: 1; user-select: none; }
  .item .del:hover { background: #2a1a1a; border-radius: 3px; }
  .item .info { flex: 1; min-width: 0; word-break: break-word; }
  .item small { color: #6b8bb0; font-size: 10px; display: block; margin-top: 2px; }
  .timer { font-size: 32px; text-align: center; font-weight: bold; color: #4da3ff; font-family: monospace; margin: 8px 0; }
  .code-out { background: #0a0e14; border: 1px dashed #4da3ff; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 11px; white-space: pre-wrap; margin-top: 8px; user-select: all; max-height: 400px; overflow-y: auto; line-height: 1.5; }
  .hint { font-size: 11px; color: #5b7a99; margin-top: 3px; }
  .badge { background: #1e4976; padding: 2px 7px; border-radius: 10px; font-size: 10px; white-space: nowrap; display: inline-block; }
  .badge.red { background: #6b1e1e; }
  .badge.green { background: #1e5f30; }
  .badge.orange { background: #6b4a1e; }
  .stat { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
  .stat > div { flex: 1; min-width: 68px; background: #0a0e14; padding: 8px 4px; border-radius: 6px; text-align: center; border: 1px solid #22324a; }
  .stat b { display: block; font-size: 18px; color: #4da3ff; line-height: 1.2; }
  .stat span { font-size: 10px; color: #7fa5c9; }
  .code-tabs { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
  .code-tab { padding: 5px 10px; font-size: 11px; background: #141c28; border: 1px solid #22324a; border-radius: 5px; cursor: pointer; user-select: none; }
  .code-tab.active { background: #1e4976; border-color: #4da3ff; color: #fff; }
  .code-tab .cnt { color: #7fa5c9; font-size: 10px; }
  .code-tab.active .cnt { color: #cce0f5; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 100; justify-content: center; align-items: center; padding: 12px; }
  .modal.show { display: flex; }
  .modal-box { background: #141c28; border: 1px solid #4da3ff; border-radius: 8px; padding: 14px; max-width: 460px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal-box h3 { margin-bottom: 10px; }
  .toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: #1e5f30; color: #fff; padding: 10px 20px; border-radius: 6px; font-size: 13px; z-index: 200; opacity: 0; pointer-events: none; transition: .3s; border: 1px solid #4dff88; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }
  .toast.error { background: #6b1e1e; border-color: #ff4d4d; }
  .footer { position: fixed; bottom: 0; left: 0; right: 0; background: #0d141d; border-top: 1px solid #22324a; padding: 5px 10px; display: flex; justify-content: space-between; font-size: 10px; color: #5b7a99; }
  .empty { text-align: center; padding: 20px; color: #5b7a99; font-size: 12px; }
  .empty::before { content: '📭'; display: block; font-size: 24px; margin-bottom: 6px; }
  .field-edit-btn { color: #ffaa00; cursor: pointer; font-size: 11px; padding: 0 4px; }
  .search-inp { margin: 8px 0; }
  .filters { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
  .filters button { padding: 4px 10px; font-size: 11px; background: #141c28; border-color: #22324a; margin: 0; }
  .filters button.active { background: #1e4976; border-color: #4da3ff; }
  .log-entry { font-size: 11px; padding: 5px 8px; border-bottom: 1px solid #1a2332; font-family: monospace; display: flex; gap: 8px; align-items: baseline; }
  .log-entry time { color: #5b7a99; white-space: nowrap; font-size: 10px; }
  .log-entry .act { color: #4da3ff; font-weight: bold; }
  .timer-block { text-align: center; padding: 12px; background: #0a0e14; border-radius: 8px; border: 1px solid #22324a; margin-bottom: 8px; }
  .timer-block.ended { border-color: #ff4d4d; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { background: #0a0e14; } 50% { background: #2a1010; } }
  @media (max-width: 600px) { body { font-size: 13px; } h1 { font-size: 14px; } .tab { font-size: 9px; min-width: 52px; padding: 7px 2px; } }
</style>
</head>
<body>

<h1>СК РФ — ТЕРМИНАЛ СЛЕДОВАТЕЛЯ v5</h1>
<div class="tabs" id="tabBar"></div>
<div id="panels"></div>

<div class="modal" id="modalField">
  <div class="modal-box">
    <h3 id="mfTitle">Поле</h3>
    <label>Название</label>
    <input id="mfLabel">
    <label>Тип</label>
    <select id="mfType">
      <option value="text">Строка</option>
      <option value="textarea">Большое поле</option>
      <option value="date">Дата</option>
      <option value="time">Время</option>
      <option value="number">Число</option>
      <option value="select">Список</option>
    </select>
    <div id="mfOptionsWrap" style="display:none">
      <label>Варианты (через запятую)</label>
      <input id="mfOptions">
    </div>
    <label>Подсказка</label>
    <input id="mfPlaceholder">
    <div class="row" style="margin-top:12px">
      <button class="green" onclick="mfSave()">Сохранить</button>
      <button class="gray" onclick="mfClose()">Отмена</button>
      <button class="red" onclick="mfDelete()">Удалить</button>
    </div>
  </div>
</div>

<div class="modal" id="modalEditItem">
  <div class="modal-box">
    <h3>Редактирование</h3>
    <div id="meFields"></div>
    <div class="row" style="margin-top:12px">
      <button class="green" onclick="meSave()">Сохранить</button>
      <button class="gray" onclick="meClose()">Отмена</button>
    </div>
  </div>
</div>

<div class="modal" id="modalCalc">
  <div class="modal-box">
    <h3>Калькулятор срока</h3>
    <label>Статья УК РФ</label>
    <input id="calcArt" placeholder="ст. 158 ч. 2">
    <div class="grid2">
      <div><label>Минимум (лет)</label><input id="calcMin" type="number" step="0.5" value="0"></div>
      <div><label>Максимум (лет)</label><input id="calcMax" type="number" step="0.5" value="0"></div>
    </div>
    <label>Смягчающие обстоятельства</label>
    <select id="calcSoft">
      <option value="1">Нет</option>
      <option value="0.75">Явка с повинной</option>
      <option value="0.66">Содействие следствию (ст. 62 ч.1)</option>
      <option value="0.5">Особый порядок (ст. 316 УПК)</option>
    </select>
    <label>Отягчающие обстоятельства</label>
    <select id="calcHard">
      <option value="1">Нет</option>
      <option value="1.25">Группа лиц</option>
      <option value="1.33">Особая жестокость</option>
      <option value="1.5">Рецидив</option>
    </select>
    <div class="code-out" id="calcOut" style="margin-top:10px">Заполни поля</div>
    <button class="green" onclick="calcSentence()">Рассчитать</button>
    <button class="gray" onclick="document.getElementById('modalCalc').classList.remove('show')">Закрыть</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="impFile" accept=".json" style="display:none" onchange="impAll(event)">

<div class="footer">
  <span>СК РФ • v5</span>
  <span id="footerTime"></span>
</div>

<script>
'use strict';

// ═══════════════ ХРАНИЛИЩЕ ═══════════════
const DB = {
  get(k, d) {
    try {
      const v = localStorage.getItem('sk5_' + k);
      if (v === null || v === undefined) return d;
      const p = JSON.parse(v);
      return p === null ? d : p;
    } catch (e) { return d; }
  },
  set(k, v) {
    try {
      localStorage.setItem('sk5_' + k, JSON.stringify(v));
      return true;
    } catch (e) { toast('Хранилище переполнено', 'error'); return false; }
  },
  del(k) { try { localStorage.removeItem('sk5_' + k); } catch (e) {} }
};

// ═══════════════ СХЕМА ═══════════════
const FACTORY = {
  cases: { label: '📁 Дела', fields: [
    { id: 'num', label: 'Номер дела', type: 'text', placeholder: '№ 001-2026' },
    { id: 'name', label: 'Фигурант', type: 'text', placeholder: 'Иванов И.И.' },
    { id: 'art', label: 'Статья', type: 'text', placeholder: 'ст. 158 УК РФ' },
    { id: 'priority', label: 'Приоритет', type: 'select', options: ['Высокий','Средний','Низкий'], placeholder: '' },
    { id: 'status', label: 'Статус', type: 'select', options: ['В производстве','На проверке','В суде','Приостановлено','Прекращено','Закрыто'], placeholder: '' },
    { id: 'note', label: 'Заметка', type: 'textarea', placeholder: '' }
  ]},
  wanted: { label: '🎯 Розыск', fields: [
    { id: 'name', label: 'ФИО', type: 'text', placeholder: '' },
    { id: 'art', label: 'Статья', type: 'text', placeholder: '' },
    { id: 'level', label: 'Уровень', type: 'select', options: ['Федеральный','Региональный','Местный'], placeholder: '' },
    { id: 'desc', label: 'Приметы', type: 'textarea', placeholder: '' }
  ]},
  arrests: { label: '🔒 Задержанные', fields: [
    { id: 'name', label: 'ФИО', type: 'text', placeholder: '' },
    { id: 'art', label: 'Статья', type: 'text', placeholder: '' },
    { id: 'time', label: 'Время', type: 'time', placeholder: '' },
    { id: 'place', label: 'Место', type: 'text', placeholder: '' },
    { id: 'witness', label: 'Свидетели', type: 'text', placeholder: '' },
    { id: 'note', label: 'Примечание', type: 'textarea', placeholder: '' }
  ]},
  persons: { label: '👤 Лица', fields: [
    { id: 'name', label: 'ФИО', type: 'text', placeholder: '' },
    { id: 'role', label: 'Роль', type: 'select', options: ['Подозреваемый','Обвиняемый','Свидетель','Потерпевший','Понятой','Адвокат','Прокурор','Коллега СК'], placeholder: '' },
    { id: 'contact', label: 'Контакт / ID', type: 'text', placeholder: '' },
    { id: 'desc', label: 'Приметы', type: 'textarea', placeholder: '' }
  ]},
  evidence: { label: '🧾 Доказательства', fields: [
    { id: 'name', label: 'Название', type: 'text', placeholder: 'Нож, отпечаток...' },
    { id: 'case', label: 'Дело', type: 'text', placeholder: '№ 001-2026' },
    { id: 'place', label: 'Место обнаружения', type: 'text', placeholder: '' },
    { id: 'date', label: 'Дата', type: 'date', placeholder: '' },
    { id: 'desc', label: 'Описание', type: 'textarea', placeholder: '' }
  ]},
  tasks: { label: '✅ Задачи', fields: [
    { id: 'text', label: 'Задача', type: 'text', placeholder: 'Допросить свидетеля' },
    { id: 'priority', label: 'Приоритет', type: 'select', options: ['Высокий','Средний','Низкий'], placeholder: '' },
    { id: 'deadline', label: 'Срок', type: 'date', placeholder: '' },
    { id: 'note', label: 'Заметка', type: 'textarea', placeholder: '' }
  ]},
  notes: { label: '🗒 Заметки', fields: [
    { id: 'text', label: 'Текст', type: 'textarea', placeholder: '' }
  ]}
};

// ═══════════════ КОДЕКСЫ — ПУСТЫЕ ═══════════════
const FACTORY_CODES = {
  'УК РФ': [],
  'УПК РФ': [],
  'КоАП РФ': [],
  'ФЗ': [],
  'ФЦК': []
};

// ═══════════════ СОСТОЯНИЕ ═══════════════
let SCHEMA = DB.get('schema', null);
if (!SCHEMA || typeof SCHEMA !== 'object' || !Object.keys(SCHEMA).length) {
  SCHEMA = JSON.parse(JSON.stringify(FACTORY));
}

let CODES = DB.get('codes', null);
if (!CODES || typeof CODES !== 'object' || !Object.keys(CODES).length) {
  CODES = JSON.parse(JSON.stringify(FACTORY_CODES));
  DB.set('codes', CODES);
}

let codeActive = DB.get('codeActive', 'УК РФ');
if (!CODES[codeActive]) codeActive = Object.keys(CODES)[0] || '';

let activeTab = DB.get('activeTab', 'dash');
let editMode = false;
let fieldTarget = null;
let itemTarget = null;
let searchTerms = {};
let caseFilter = 'all';

// ═══════════════ УТИЛИТЫ ═══════════════
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
let _codeBooks = [];
function safeSetBook(idx) {
  try {
    const name = _codeBooks[idx];
    if (name && CODES[name]) {
      codeActive = name;
      DB.set('codeActive', name);
      render();
    }
  } catch (e) { toast('Ошибка', 'error'); }
}
function toast(msg, type) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast show' + (type === 'error' ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = 'toast'; }, 2200);
}
function uid() { return 'f' + Date.now() + Math.random().toString(36).slice(2, 6); }
function fmtTime(s) {
  s = Math.max(0, Math.floor(s || 0));
  return String(Math.floor(s / 3600)).padStart(2, '0') + ':' +
         String(Math.floor(s % 3600 / 60)).padStart(2, '0') + ':' +
         String(s % 60).padStart(2, '0');
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}
function today() { return new Date().toLocaleDateString('ru-RU'); }
function nowTime() { return new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); }

// ═══════════════ ЖУРНАЛ ═══════════════
let LOG = DB.get('log', []);
function addLog(action, detail) {
  LOG.unshift({ t: Date.now(), action, detail: detail || '' });
  if (LOG.length > 300) LOG = LOG.slice(0, 300);
  DB.set('log', LOG);
}

// ═══════════════ РЕНДЕР ═══════════════
function render() {
  try {
    const tabs = [
      { id: 'dash', label: '📊 Дашборд' },
      ...Object.keys(SCHEMA).map(k => ({ id: k, label: SCHEMA[k].label || 'Без названия' })),
      { id: 'docs', label: '📄 Документы' },
      { id: 'codes', label: '📖 Кодексы' },
      { id: 'timer', label: '⏱ Таймеры' },
      { id: 'journal', label: '📜 Журнал' },
      { id: 'settings', label: '⚙ Настройки' }
    ];

    if (!tabs.find(t => t.id === activeTab)) activeTab = 'dash';

    document.getElementById('tabBar').innerHTML = tabs.map(t =>
      `<div class="tab ${t.id === activeTab ? 'active' : ''}" data-tab="${esc(t.id)}">${esc(t.label)}</div>`
    ).join('');

    document.querySelectorAll('.tab').forEach(el => {
      el.onclick = () => go(el.dataset.tab);
    });

    let html = '';
    tabs.forEach(t => {
      if (t.id === 'dash') html += panelDash();
      else if (t.id === 'docs') html += panelDocs();
      else if (t.id === 'codes') html += panelCodes();
      else if (t.id === 'timer') html += panelTimer();
      else if (t.id === 'journal') html += panelJournal();
      else if (t.id === 'settings') html += panelSettings();
      else html += panelData(t.id);
    });
    document.getElementById('panels').innerHTML = html;

    if (activeTab === 'timer') updTimer();
    if (activeTab === 'docs') renderDocForm();
  } catch (e) {
    console.error('Render error:', e);
    document.getElementById('panels').innerHTML =
      '<div class="card"><h3>Ошибка</h3>' +
      '<div class="hint">' + esc(e.message) + '</div>' +
      '<button onclick="location.reload()">Перезагрузить</button> ' +
      '<button class="red" onclick="fullReset()">Полный сброс</button></div>';
  }
}

function go(id) {
  activeTab = id;
  DB.set('activeTab', id);
  editMode = false;
  render();
}

// ═══════════════ ПАНЕЛЬ ДАННЫХ ═══════════════
function panelData(key) {
  const sch = SCHEMA[key];
  if (!sch || !Array.isArray(sch.fields)) return '<div class="panel"></div>';

  let items = DB.get(key, []);
  if (!Array.isArray(items)) items = [];

  const q = (searchTerms[key] || '').toLowerCase();
  let filtered = q
    ? items.filter(it => sch.fields.some(f => String(it[f.id] || '').toLowerCase().includes(q)))
    : items;

  // Фильтр для дел
  if (key === 'cases' && caseFilter !== 'all') {
    filtered = filtered.filter(it => it.status === caseFilter);
  }

  const form = `<div class="card">
    <h3>
      <span>➕ ${esc(sch.label)}</span>
      <span>
        <button class="sm ${editMode ? 'orange' : 'gray'}" onclick="toggleEdit()">${editMode ? 'Готово' : 'Правка'}</button>
        <button class="sm green" onclick="openAddField('${esc(key)}')">+ поле</button>
      </span>
    </h3>
    ${sch.fields.map(f => fieldHTML(key, f)).join('')}
    <button class="green" onclick="addItem('${esc(key)}')">➕ Добавить запись</button>
  </div>`;

  let filters = '';
  if (key === 'cases') {
    filters = `<div class="filters">
      <button class="${caseFilter==='all'?'active':''}" data-cfilter="all">Все</button>
      <button class="${caseFilter==='В производстве'?'active':''}" data-cfilter="В производстве">В производстве</button>
      <button class="${caseFilter==='В суде'?'active':''}" data-cfilter="В суде">В суде</button>
      <button class="${caseFilter==='Закрыто'?'active':''}" data-cfilter="Закрыто">Закрыто</button>
    </div>`;
  }

  const search = items.length > 3
    ? `<input class="search-inp" placeholder="Поиск..." value="${esc(searchTerms[key] || '')}" data-search="${esc(key)}">`
    : '';

  const list = filtered.length
    ? filtered.map(it => itemHTML(key, it, items.indexOf(it))).join('')
    : '<div class="empty">' + (q ? 'Ничего не найдено' : 'Пока пусто') + '</div>';

  const html = `<div class="panel ${activeTab === key ? 'active' : ''}" id="panel_${esc(key)}">
    ${form}
    ${filters}
    ${search}
    <div id="list_${esc(key)}">${list}</div>
  </div>`;

  setTimeout(() => {
    const s = document.querySelector(`[data-search="${key}"]`);
    if (s) s.oninput = () => { searchTerms[key] = s.value; renderListOnly(key); };
    document.querySelectorAll('[data-cfilter]').forEach(b => {
      b.onclick = () => { caseFilter = b.dataset.cfilter; render(); };
    });
  }, 0);

  return html;
}

function renderListOnly(key) {
  const sch = SCHEMA[key];
  if (!sch) return;
  let items = DB.get(key, []);
  if (!Array.isArray(items)) items = [];
  const q = (searchTerms[key] || '').toLowerCase();
  let filtered = q
    ? items.filter(it => sch.fields.some(f => String(it[f.id] || '').toLowerCase().includes(q)))
    : items;
  if (key === 'cases' && caseFilter !== 'all') {
    filtered = filtered.filter(it => it.status === caseFilter);
  }
  const el = document.getElementById('list_' + key);
  if (!el) return;
  el.innerHTML = filtered.length
    ? filtered.map(it => itemHTML(key, it, items.indexOf(it))).join('')
    : '<div class="empty">' + (q ? 'Ничего не найдено' : 'Пока пусто') + '</div>';
}

function fieldHTML(key, f) {
  const id = 'f_' + key + '_' + f.id;
  const ph = esc(f.placeholder || '');
  const editBtn = editMode
    ? ` <span class="field-edit-btn" data-editfield="${esc(key)}|${esc(f.id)}">✎</span>`
    : '';
  const label = `<label>${esc(f.label)}${editBtn}</label>`;
  const type = f.type || 'text';
  if (type === 'textarea') return label + `<textarea id="${id}" placeholder="${ph}"></textarea>`;
  if (type === 'select') {
    return label + `<select id="${id}">${(f.options || []).map(o => `<option>${esc(o)}</option>`).join('')}</select>`;
  }
  return label + `<input id="${id}" type="${type}" placeholder="${ph}">`;
}

function itemHTML(key, it, realIndex) {
  const sch = SCHEMA[key];
  if (!sch || !sch.fields.length) return '';
  const title = String(it[sch.fields[0].id] || '(без названия)');
  const rest = sch.fields.slice(1).map(f => it[f.id]).filter(v => v).join(' • ');
  const isArrest = key === 'arrests' && it._ts;
  const isWanted = key === 'wanted';
  const done = !!it._done;

  let extraClass = '';
  if (isWanted) extraClass = 'wanted';
  if (isArrest) extraClass = 'arrest';
  if (it.priority === 'Высокий') extraClass += ' priority-high';
  if (it.priority === 'Средний') extraClass += ' priority-med';
  if (it.priority === 'Низкий') extraClass += ' priority-low';

  let timerLine = '';
  if (isArrest) {
    const passed = Math.floor((Date.now() - it._ts) / 60000);
    const left = 48 * 60 - passed;
    const hh = Math.floor(passed / 60), mm = passed % 60;
    if (left <= 0) {
      timerLine = '<small style="color:#ff4d4d">48ч ИСТЕКЛО</small>';
    } else {
      const lh = Math.floor(left / 60), lm = left % 60;
      const color = left < 60 ? '#ff4d4d' : left < 240 ? '#ffaa00' : '#4dff88';
      timerLine = `<small>Прошло: ${hh}ч ${mm}м • Осталось: <b style="color:${color}">${lh}ч ${lm}м</b></small>`;
    }
  }

  let deadlineLine = '';
  if (key === 'tasks' && it.deadline) {
    const d = new Date(it.deadline);
    const now = new Date();
    const diff = Math.ceil((d - now) / (1000 * 60 * 60 * 24));
    if (diff < 0) deadlineLine = `<small style="color:#ff4d4d">Просрочено на ${Math.abs(diff)} дн</small>`;
    else if (diff === 0) deadlineLine = '<small style="color:#ffaa00">Сегодня</small>';
    else if (diff <= 3) deadlineLine = `<small style="color:#ffaa00">Через ${diff} дн</small>`;
    else deadlineLine = `<small>До ${it.deadline} (${diff} дн)</small>`;
  }

  return `<div class="item ${done ? 'done' : ''} ${extraClass}">
    <div class="info">
      <b>${esc(title)}</b>
      ${rest ? '<small>' + esc(rest) + '</small>' : ''}
      ${timerLine}
      ${deadlineLine}
    </div>
    <div style="display:flex;gap:2px;align-items:flex-start">
      <button class="sm gray" data-toggleitem="${esc(key)}|${realIndex}" title="Отметить">${done ? '↺' : '✓'}</button>
      <button class="sm gray" data-edititem="${esc(key)}|${realIndex}" title="Редактировать">✎</button>
      <span class="del" data-delitem="${esc(key)}|${realIndex}" title="Удалить">✕</span>
    </div>
  </div>`;
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.dataset && t.dataset.editfield) {
    const [k, id] = t.dataset.editfield.split('|');
    openField(k, id);
    return;
  }
  if (t.dataset && t.dataset.edititem) {
    const [k, i] = t.dataset.edititem.split('|');
    openEditItem(k, parseInt(i, 10));
    return;
  }
  if (t.dataset && t.dataset.delitem) {
    const [k, i] = t.dataset.delitem.split('|');
    delItem(k, parseInt(i, 10));
    return;
  }
  if (t.dataset && t.dataset.toggleitem) {
    const [k, i] = t.dataset.toggleitem.split('|');
    toggleItem(k, parseInt(i, 10));
    return;
  }
  if (t.dataset && t.dataset.book !== undefined) {
    safeSetBook(parseInt(t.dataset.book, 10));
    return;
  }
  if (t.dataset && t.dataset.editcode !== undefined) {
    editCode(parseInt(t.dataset.editcode, 10));
    return;
  }
  if (t.dataset && t.dataset.delcode !== undefined) {
    delCode(parseInt(t.dataset.delcode, 10));
    return;
  }
});

function addItem(key) {
  const sch = SCHEMA[key];
  if (!sch) return;
  const obj = {};
  let hasValue = false;
  sch.fields.forEach(f => {
    const el = document.getElementById('f_' + key + '_' + f.id);
    const v = el ? el.value.trim() : '';
    obj[f.id] = v;
    if (v) hasValue = true;
  });
  if (!hasValue) { toast('Заполни хотя бы одно поле', 'error'); return; }

  if (key === 'arrests') obj._ts = Date.now();

  let items = DB.get(key, []);
  if (!Array.isArray(items)) items = [];
  items.unshift(obj);
  if (!DB.set(key, items)) return;

  sch.fields.forEach(f => {
    const el = document.getElementById('f_' + key + '_' + f.id);
    if (el && f.type !== 'select') el.value = '';
  });

  addLog('Добавлено', sch.label + ': ' + (obj[sch.fields[0].id] || ''));
  toast('Добавлено');
  render();
}

function delItem(key, i) {
  let items = DB.get(key, []);
  if (!Array.isArray(items) || !items[i]) return;
  if (!confirm('Удалить запись?')) return;
  const sch = SCHEMA[key];
  addLog('Удалено', (sch ? sch.label : key) + ': ' + (items[i][sch.fields[0].id] || ''));
  items.splice(i, 1);
  DB.set(key, items);
  toast('Удалено');
  render();
}

function toggleItem(key, i) {
  let items = DB.get(key, []);
  if (!Array.isArray(items) || !items[i]) return;
  items[i]._done = !items[i]._done;
  DB.set(key, items);
  render();
}

function toggleEdit() { editMode = !editMode; render(); }

// ═══════════════ РЕДАКТОР ПОЛЯ ═══════════════
function openAddField(key) {
  if (!SCHEMA[key]) return;
  fieldTarget = { key, fieldId: null };
  document.getElementById('mfTitle').textContent = 'Добавить поле';
  document.getElementById('mfLabel').value = '';
  document.getElementById('mfType').value = 'text';
  document.getElementById('mfPlaceholder').value = '';
  document.getElementById('mfOptions').value = '';
  document.getElementById('mfOptionsWrap').style.display = 'none';
  document.getElementById('modalField').classList.add('show');
  setTimeout(() => document.getElementById('mfLabel').focus(), 100);
}

function openField(key, fieldId) {
  if (!SCHEMA[key]) return;
  const f = SCHEMA[key].fields.find(x => x.id === fieldId);
  if (!f) return;
  fieldTarget = { key, fieldId };
  document.getElementById('mfTitle').textContent = 'Редактирование поля';
  document.getElementById('mfLabel').value = f.label || '';
  document.getElementById('mfType').value = f.type || 'text';
  document.getElementById('mfPlaceholder').value = f.placeholder || '';
  document.getElementById('mfOptions').value = (f.options || []).join(', ');
  document.getElementById('mfOptionsWrap').style.display = f.type === 'select' ? 'block' : 'none';
  document.getElementById('modalField').classList.add('show');
}

document.getElementById('mfType').addEventListener('change', function() {
  document.getElementById('mfOptionsWrap').style.display = this.value === 'select' ? 'block' : 'none';
});

function mfClose() {
  document.getElementById('modalField').classList.remove('show');
  fieldTarget = null;
}

function mfSave() {
  if (!fieldTarget || !SCHEMA[fieldTarget.key]) return;
  const label = document.getElementById('mfLabel').value.trim();
  const type = document.getElementById('mfType').value;
  const placeholder = document.getElementById('mfPlaceholder').value.trim();
  const options = document.getElementById('mfOptions').value.split(',').map(s => s.trim()).filter(Boolean);
  if (!label) { toast('Введи название', 'error'); return; }

  if (fieldTarget.fieldId) {
    const f = SCHEMA[fieldTarget.key].fields.find(x => x.id === fieldTarget.fieldId);
    if (f) { f.label = label; f.type = type; f.placeholder = placeholder; f.options = options; }
  } else {
    SCHEMA[fieldTarget.key].fields.push({ id: uid(), label, type, placeholder, options });
  }
  DB.set('schema', SCHEMA);
  mfClose();
  toast('Сохранено');
  render();
}

function mfDelete() {
  if (!fieldTarget || !fieldTarget.fieldId || !SCHEMA[fieldTarget.key]) return;
  if (!confirm('Удалить поле?')) return;
  SCHEMA[fieldTarget.key].fields = SCHEMA[fieldTarget.key].fields.filter(x => x.id !== fieldTarget.fieldId);
  DB.set('schema', SCHEMA);
  mfClose();
  toast('Поле удалено');
  render();
}

// ═══════════════ РЕДАКТОР ЗАПИСИ ═══════════════
function openEditItem(key, index) {
  let items = DB.get(key, []);
  if (!Array.isArray(items)) return;
  const it = items[index];
  if (!it) return;
  const sch = SCHEMA[key];
  if (!sch) return;
  itemTarget = { key, index };
  document.getElementById('meFields').innerHTML = sch.fields.map(f => {
    const id = 'me_' + f.id;
    const v = esc(it[f.id] || '');
    if (f.type === 'textarea') return `<label>${esc(f.label)}</label><textarea id="${id}">${v}</textarea>`;
    if (f.type === 'select') {
      return `<label>${esc(f.label)}</label><select id="${id}">${(f.options || []).map(o => `<option ${o === it[f.id] ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    }
    return `<label>${esc(f.label)}</label><input id="${id}" type="${f.type || 'text'}" value="${v}">`;
  }).join('');
  document.getElementById('modalEditItem').classList.add('show');
}

function meClose() {
  document.getElementById('modalEditItem').classList.remove('show');
  itemTarget = null;
}

function meSave() {
  if (!itemTarget) return;
  const { key, index } = itemTarget;
  let items = DB.get(key, []);
  if (!Array.isArray(items) || !items[index]) return;
  const sch = SCHEMA[key];
  if (!sch) return;
  sch.fields.forEach(f => {
    const el = document.getElementById('me_' + f.id);
    if (el) items[index][f.id] = el.value.trim();
  });
  DB.set(key, items);
  meClose();
  toast('Сохранено');
  render();
}

function panelCodes() {
  try {
    const books = Object.keys(CODES);
    if (!books.length) {
      CODES['Новый кодекс'] = [];
      DB.set('codes', CODES);
      codeActive = 'Новый кодекс';
      DB.set('codeActive', codeActive);
      return panelCodes();
    }
    if (!codeActive || !CODES[codeActive]) {
      codeActive = books[0];
      DB.set('codeActive', codeActive);
    }

    _codeBooks = books;

    const tabsHTML = books.map((b, idx) =>
      `<span class="code-tab ${b === codeActive ? 'active' : ''}" data-book="${idx}">
        ${esc(b)} <span class="cnt">${CODES[b].length}</span>
      </span>`
    ).join('') + `<span class="code-tab" style="border-color:#4dff88" onclick="addBook()">+ Кодекс</span>`;

    const current = CODES[codeActive] || [];
    const q = (searchTerms['codes'] || '').toLowerCase();
    const filtered = q
      ? current.map((c, i) => ({ ...c, _i: i })).filter(c => (c.art + c.name + c.min).toLowerCase().includes(q))
      : current.map((c, i) => ({ ...c, _i: i }));

    const list = filtered.length
      ? filtered.map(c =>
          `<div class="item">
            <div class="info">
              <b>${esc(c.art)}</b> — ${esc(c.name)}
              <small>Наказание: ${esc(c.min)}</small>
            </div>
            <div style="display:flex;gap:2px">
              <button class="sm gray" data-editcode="${c._i}">✎</button>
              <span class="del" data-delcode="${c._i}">✕</span>
            </div>
          </div>`
        ).join('')
      : '<div class="empty">' + (q ? 'Ничего не найдено' : 'Статей нет — добавь через форму ниже') + '</div>';

    return `<div class="panel ${activeTab === 'codes' ? 'active' : ''}">
      <div class="card">
        <h3>📖 Кодексы</h3>
        <div class="code-tabs">${tabsHTML}</div>
      </div>
      <div class="card">
        <h3>➕ Добавить статью в «${esc(codeActive)}»</h3>
        <div class="grid2">
          <div><label>Статья</label><input id="acArt" placeholder="ст. 105"></div>
          <div><label>Наказание</label><input id="acMin" placeholder="6–15 лет"></div>
        </div>
        <label>Название</label>
        <input id="acName" placeholder="Убийство">
        <button class="green" onclick="addCode()">➕ Добавить статью</button>
        <button class="gray" onclick="renameBook()">✎ Переименовать</button>
        <button class="red" onclick="delBook()">🗑 Удалить кодекс</button>
      </div>
      ${current.length > 5 ? `<input class="search-inp" id="codeSearch" placeholder="Поиск по статьям..." value="${esc(searchTerms['codes'] || '')}">` : ''}
      <div>${list}</div>
    </div>`;
  } catch (e) {
    return `<div class="panel active"><div class="card"><h3>Ошибка</h3>
      <div class="hint">${esc(e.message)}</div>
      <button class="red" onclick="resetCodes()">Сбросить кодексы</button></div></div>`;
  }
}

document.addEventListener('input', e => {

function resetCodes() {
  if (!confirm('Сбросить все кодексы к пустым?')) return;
  CODES = JSON.parse(JSON.stringify(FACTORY_CODES));
  DB.set('codes', CODES);
  codeActive = Object.keys(CODES)[0];
  DB.set('codeActive', codeActive);
  render();
  toast('Кодексы очищены');
}

function addBook() {
  const n = prompt('Название нового кодекса:');
  if (!n || !n.trim()) return;
  const name = n.trim();
  if (CODES[name]) { toast('Уже есть', 'error'); return; }
  CODES[name] = [];
  DB.set('codes', CODES);
  codeActive = name;
  DB.set('codeActive', name);
  render();
  toast('Создан');
}

function renameBook() {
  if (!codeActive || !CODES[codeActive]) { toast('Не выбран', 'error'); return; }
  const oldName = codeActive;
  const n = prompt('Новое название:', oldName);
  if (!n || !n.trim() || n.trim() === oldName) return;
  const name = n.trim();
  if (CODES[name]) { toast('Уже есть', 'error'); return; }
  CODES[name] = CODES[oldName];
  delete CODES[oldName];
  codeActive = name;
  DB.set('codes', CODES);
  DB.set('codeActive', name);
  render();
  toast('Переименовано');
}

function delBook() {
  if (!codeActive || !CODES[codeActive]) { toast('Не выбран', 'error'); return; }
  if (!confirm('Удалить «' + codeActive + '»?')) return;
  const delName = codeActive;
  delete CODES[delName];
  const remain = Object.keys(CODES);
  if (remain.length) codeActive = remain[0];
  else { CODES['Новый кодекс'] = []; codeActive = 'Новый кодекс'; }
  DB.set('codes', CODES);
  DB.set('codeActive', codeActive);
  render();
  toast('Удалён');
}

function addCode() {
  if (!codeActive || !CODES[codeActive]) { toast('Не выбран', 'error'); return; }
  const a = document.getElementById('acArt');
  const n = document.getElementById('acName');
  const m = document.getElementById('acMin');
  if (!a || !n || !m) return;
  if (!a.value.trim() || !n.value.trim()) { toast('Заполни статью и название', 'error'); return; }
  CODES[codeActive].push({ art: a.value.trim(), name: n.value.trim(), min: m.value.trim() });
  DB.set('codes', CODES);
  a.value = ''; n.value = ''; m.value = '';
  render();
  toast('Добавлено');
}

function delCode(i) {
  if (!codeActive || !CODES[codeActive]) return;
  if (!CODES[codeActive][i]) return;
  if (!confirm('Удалить статью?')) return;
  CODES[codeActive].splice(i, 1);
  DB.set('codes', CODES);
  render();
  toast('Удалено');
}

function editCode(i) {
  if (!codeActive || !CODES[codeActive]) return;
  const c = CODES[codeActive][i];
  if (!c) return;
  const art = prompt('Статья:', c.art);
  if (art === null) return;
  const name = prompt('Название:', c.name);
  if (name === null) return;
  const min = prompt('Наказание:', c.min);
  if (min === null) return;
  c.art = art.trim(); c.name = name.trim(); c.min = min.trim();
  DB.set('codes', CODES);
  render();
  toast('Обновлено');
}

let tSec = 48 * 3600, tInt = null, tEnd = null;
let customTimers = DB.get('customTimers', []);

function panelTimer() {
  return `<div class="panel ${activeTab === 'timer' ? 'active' : ''}">

      <div class="timer-block" id="tBlock">
        <div class="timer" id="tDisp">${fmtTime(tSec)}</div>
      </div>
      <div class="row">
        <button class="green" onclick="tStart()">▶ Старт</button>
        <button onclick="tPause()">⏸ Пауза</button>
        <button class="red" onclick="tReset()">↻ Сброс</button>
      </div>
      <div class="hint" id="tInfo">Не запущен</div>
    </div>
    <div class="card">
      <h3>Быстрые пресеты</h3>
      <div class="row">
        <button onclick="tPreset(15)">15 мин</button>
        <button onclick="tPreset(60)">1 час</button>
        <button onclick="tPreset(180)">3 часа</button>
        <button onclick="tPreset(1440)">24 часа</button>
        <button onclick="tPreset(48*60)">48 часов</button>
      </div>
    </div>
    <div class="card">
      <h3>Свои таймеры</h3>
      <div class="row">
        <div><label>Название</label><input id="ctName" placeholder="Обыск"></div>
        <div><label>Минут</label><input id="ctMin" type="number" value="30"></div>
      </div>
      <button class="green" onclick="addCustomTimer()">Добавить</button>
      <div style="margin-top:8px">
        ${customTimers.map((ct, i) =>
          `<div class="item">
            <div class="info"><b>${esc(ct.name)}</b><small>${ct.min} мин</small></div>
            <div>
              <button class="sm green" data-ctstart="${i}">▶</button>
              <span class="del" data-ctdel="${i}">✕</span>
            </div>
          </div>`
        ).join('') || '<div class="hint">Нет своих таймеров</div>'}
      </div>
    </div>
  </div>`;
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.dataset && t.dataset.ctstart !== undefined) {
    const i = parseInt(t.dataset.ctstart, 10);
    const ct = customTimers[i];
    if (ct) { tPreset(ct.min); toast('Установлен: ' + ct.name); }
    return;
  }
  if (t.dataset && t.dataset.ctdel !== undefined) {
    const i = parseInt(t.dataset.ctdel, 10);
    if (customTimers[i] && confirm('Удалить таймер?')) {
      customTimers.splice(i, 1);
      DB.set('customTimers', customTimers);
      render();
    }
    return;
  }
});

function addCustomTimer() {
  const n = document.getElementById('ctName').value.trim();
  const m = parseInt(document.getElementById('ctMin').value, 10);
  if (!n || !m || m < 1) { toast('Заполни', 'error'); return; }
  customTimers.push({ name: n, min: m });
  DB.set('customTimers', customTimers);
  render();
  toast('Добавлен');
}

function updTimer() {
  const el = document.getElementById('tDisp');
  if (!el) return;
  el.textContent = fmtTime(tSec);
  const color = tSec < 3600 ? '#ff4d4d' : tSec < 4 * 3600 ? '#ffaa00' : '#4da3ff';
  el.style.color = color;
  const bl = document.getElementById('tBlock');
  if (bl) {
    if (tSec <= 0) bl.classList.add('ended');
    else bl.classList.remove('ended');
  }
}

function tStart() {
  if (tInt) return;
  const info = document.getElementById('tInfo');
  if (info) info.textContent = 'Запущен в ' + nowTime();
  tEnd = Date.now() + tSec * 1000;
  tInt = setInterval(() => {
    tSec = Math.max(0, Math.round((tEnd - Date.now()) / 1000));
    updTimer();
    if (tSec <= 0) {
      clearInterval(tInt); tInt = null;
      toast('Время истекло!', 'error');
      addLog('Таймер', 'Истёк');
      if (info) info.textContent = 'Истёк';
    }
  }, 1000);
}

function tPause() {
  clearInterval(tInt); tInt = null;
  const info = document.getElementById('tInfo');
  if (info) info.textContent = 'Пауза';
}

function tReset() {
  tPause();
  tSec = 48 * 3600;
  updTimer();
  const info = document.getElementById('tInfo');
  if (info) info.textContent = 'Сброшен';
}

function tPreset(min) {
  tPause();
  tSec = Math.round(min * 60);
  updTimer();
  const info = document.getElementById('tInfo');
  if (info) info.textContent = 'Установлено: ' + min + ' мин';
}

// ═══════════════ ЭКСПОРТ / ИМПОРТ ═══════════════
function expAll() {
  try {
    const data = { _version: 5, _exported: new Date().toISOString(), schema: SCHEMA, codes: CODES, codeActive, log: LOG };
    Object.keys(SCHEMA).forEach(k => data[k] = DB.get(k, []));
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sk_backup_' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('Экспорт готов');
  } catch (e) {
    toast('Ошибка', 'error');
  }
}

function impAll(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (d.schema && typeof d.schema === 'object') { SCHEMA = d.schema; DB.set('schema', SCHEMA); }
      if (d.codes && typeof d.codes === 'object') { CODES = d.codes; DB.set('codes', CODES); }
      if (d.codeActive && CODES[d.codeActive]) codeActive = d.codeActive;
      else codeActive = Object.keys(CODES)[0] || '';
      DB.set('codeActive', codeActive);
      if (Array.isArray(d.log)) { LOG = d.log; DB.set('log', LOG); }
      Object.keys(SCHEMA).forEach(k => {
        if (Array.isArray(d[k])) DB.set(k, d[k]);
      });
      render();
      toast('Импорт завершён');
    } catch (err) {
      toast('Ошибка файла', 'error');
    }
  };
  r.readAsText(f);
  e.target.value = '';
}

// ═══════════════ КАЛЬКУЛЯТОР СРОКА ═══════════════
function calcSentence() {
  const art = document.getElementById('calcArt').value.trim() || '—';
  const min = parseFloat(document.getElementById('calcMin').value) || 0;
  const max = parseFloat(document.getElementById('calcMax').value) || 0;
  const soft = parseFloat(document.getElementById('calcSoft').value) || 1;
  const hard = parseFloat(document.getElementById('calcHard').value) || 1;

  if (!max) {
    document.getElementById('calcOut').textContent = 'Укажи максимум';
    return;
  }

  const finalMin = Math.max(0, min * soft * hard);
  const finalMax = Math.max(0, max * soft * hard);

  document.getElementById('calcOut').textContent =
    `СТАТЬЯ: ${art}\n\n` +
    `Базовый диапазон: ${min} – ${max} лет\n` +
    `Коэффициент смягчения: ${soft}\n` +
    `Коэффициент отягчения: ${hard}\n\n` +
    `ИТОГОВЫЙ СРОК: ${finalMin.toFixed(1)} – ${finalMax.toFixed(1)} лет\n\n` +
    `В месяцах: ${(finalMin*12).toFixed(0)} – ${(finalMax*12).toFixed(0)} мес.\n` +
    `В днях: ${(finalMin*365).toFixed(0)} – ${(finalMax*365).toFixed(0)} дн.`;
}

// ═══════════════ ФУТЕР ═══════════════
function tick() {
  const ft = document.getElementById('footerTime');
  if (ft) ft.textContent = new Date().toLocaleTimeString('ru-RU');
}
setInterval(tick, 1000);
setInterval(() => { if (activeTab === 'arrests') renderListOnly('arrests'); }, 60000);

document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => {
    if (e.target === m) m.classList.remove('show');
  });
});

// ═══════════════ СТАРТ ═══════════════
tick();
render();

window.addEventListener('error', e => {
  console.error('Global:', e.error);
});
</script>
